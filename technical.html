<h1>📈 Technical Chart</h1>
<iframe id="chart" width="100%" height="500"></iframe>

<script>
const params = new URLSearchParams(window.location.search);
const symbol = params.get("symbol");

document.getElementById("chart").src =
`https://www.tradingview.com/chart/?symbol=NSE:${symbol.replace('.NS','')}`;
</script>
